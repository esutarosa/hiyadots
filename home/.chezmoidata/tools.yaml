# group: prompt section. paths: files under $HOME owned by the tool.
# pkg: same name in brew, pacman and nix. Otherwise use brew, cask, pacman, aur, nix.
# apt: listed separately, Debian names and versions differ. Only tools meant for Debian have it.
# winget: Windows package ids. Only tools meant for Windows have it.
# keep_package: unselecting removes the config links, never the package.
# Third-party brew formulae use full names, so Homebrew trusts that formula and not the whole tap.
profiles:
  default:
    - zsh
    - nushell
    - alacritty
    - ghostty
    - tmux
    - neovim
    - neovim-dev
    - yabai
    - skhd
    - kanata
    - meslo-font
    - git
    - gh
    - topgrade
    - eza
    - zoxide
    - fzf
    - ripgrep
    - jq
    - just
    - lazygit
    - fastfetch
    - cloc
    - imagemagick
    - mkcert
    - lftp
    - lazysql
    - mise
    - go
    - nvm
    - node
    - python
    - llvm
    - rust-analyzer
    - flutter
    - docker
    - chromium
    - zen
    - codex
  server: [zsh, tmux, neovim, git, gh, eza, zoxide, fzf, ripgrep, jq, lazygit, terminfo]
  windows: [powershell, alacritty, meslo-font, neovim, git, gh, eza, zoxide, fzf, ripgrep, jq, lazygit]
tools:
  zsh:
    group: shell
    paths: [.zshrc, .zshenv, .zprofile, .p10k.zsh]
    brew: [powerlevel10k, zsh-autosuggestions, zsh-syntax-highlighting]
    pacman: [zsh, zsh-autosuggestions, zsh-syntax-highlighting]
    apt: [zsh, zsh-autosuggestions, zsh-syntax-highlighting]
    nix: [zsh, zsh-powerlevel10k, zsh-autosuggestions, zsh-syntax-highlighting]
  nushell:
    group: shell
    paths: [.config/nushell, .config/starship, Library/Application Support/nushell]
    pkg: [nushell, starship]
  powershell:
    group: shell
    paths: [.config/powershell, .config/starship]
    winget: [Starship.Starship]

  ghostty:
    group: terminal
    paths: [.config/ghostty]
    cask: [ghostty, font-plemol-jp-nf]
    pacman: [ghostty]
    nix: [ghostty]
  alacritty: # Homebrew disabled the cask on 2026-09-01, on macOS the installer takes the GitHub build
    group: terminal
    keep_package: true
    paths: [.config/alacritty, AppData/Roaming/alacritty]
    winget: [Alacritty.Alacritty]
    cask: [alacritty]
    pacman: [alacritty]
    nix: [alacritty]
  tmux:
    group: terminal
    paths: [.config/tmux]
    pkg: [tmux, fzf]
    apt: [tmux, fzf]

  neovim:
    group: editor
    paths: [.config/nvim, .local/bin/nvim, .local/bin/tree-sitter]
    pkg: [neovim, fd]
    brew: [tree-sitter-cli, ripgrep]
    pacman: [tree-sitter-cli, ripgrep, base-devel, unzip]
    apt: [fd-find, ripgrep, gcc, make, unzip, curl] # neovim and tree-sitter come from GitHub releases, apt's are too old
    winget: [Neovim.Neovim, sharkdp.fd, BurntSushi.ripgrep.MSVC, tree-sitter.tree-sitter-cli, BrechtSanders.WinLibs.POSIX.UCRT]
    nix: [tree-sitter, ripgrep, gcc, gnumake, unzip]
  neovim-dev: # language servers and their runtimes
    group: editor
    brew: [luarocks, lazygit, node, go]
    pacman: [luarocks, lazygit, nodejs, npm, go, python]
    nix: [luarocks, lazygit, nodejs, go, python3]

  yabai:
    group: desktop
    paths: [.config/yabai]
    brew: [asmvik/formulae/yabai]
  skhd:
    group: desktop
    paths: [.config/skhd]
    brew: [asmvik/formulae/skhd]
  kanata:
    group: desktop
    brew: [kanata]
    aur: [kanata-bin]
    nix: [kanata]
  meslo-font:
    group: desktop
    cask: [font-meslo-lg-nerd-font]
    pacman: [ttf-meslo-nerd]
    nix: [nerd-fonts.meslo-lg]
    winget: [] # not in winget, the Windows package script installs it

  git:
    group: cli
    paths: [.gitconfig, .config/git]
    pkg: [git]
    apt: [git]
    winget: [Git.Git]
  gh:
    group: cli
    brew: [gh]
    pacman: [github-cli]
    apt: [gh]
    winget: [GitHub.cli]
    nix: [gh]
  terminfo: {group: cli, apt: [ncurses-term]} # lets Alacritty connect over ssh; Arch ships it with ncurses
  topgrade:
    group: cli
    paths: [.config/topgrade.toml]
    brew: [topgrade]
    aur: [topgrade-bin]
    nix: [topgrade]
  eza: {group: cli, pkg: [eza], apt: [eza], winget: [eza-community.eza]}
  zoxide: {group: cli, pkg: [zoxide], apt: [zoxide], winget: [ajeetdsouza.zoxide]}
  fzf: {group: cli, paths: [.config/fzf], pkg: [fzf], apt: [fzf], winget: [junegunn.fzf]}
  ripgrep: {group: cli, pkg: [ripgrep], apt: [ripgrep], winget: [BurntSushi.ripgrep.MSVC]}
  jq: {group: cli, pkg: [jq], apt: [jq], winget: [jqlang.jq]}
  just: {group: cli, pkg: [just]}
  lazygit: {group: cli, pkg: [lazygit], apt: [lazygit], winget: [JesseDuffield.lazygit]}
  fastfetch: {group: cli, pkg: [fastfetch]}
  cloc: {group: cli, pkg: [cloc]}
  imagemagick: {group: cli, pkg: [imagemagick]}
  mkcert: {group: cli, pkg: [mkcert]}
  lftp: {group: cli, pkg: [lftp]}
  lazysql:
    group: cli
    brew: [lazysql]
    aur: [lazysql]
    nix: [lazysql]

  mise:
    group: dev
    paths: [.config/mise]
    pkg: [mise]
  go: {group: dev, pkg: [go]}
  nvm:
    group: dev
    brew: [nvm]
    pacman: [nvm]
  node:
    group: dev
    brew: [node]
    pacman: [nodejs]
    nix: [nodejs]
  python:
    group: dev
    brew: [python@3.13]
    pacman: [python]
    nix: [python3]
  llvm: {group: dev, pkg: [llvm]}
  rust-analyzer: {group: dev, pkg: [rust-analyzer]}
  flutter:
    group: dev
    cask: [flutter]
    aur: [flutter]
    nix: [flutter]

  docker:
    group: apps
    cask: [docker-desktop]
    pacman: [docker]
    nix: [docker]
  chromium:
    group: apps
    cask: [chromium]
    pacman: [chromium]
    nix: [chromium]
  zen:
    group: apps
    cask: [zen]
    aur: [zen-browser-bin]
  codex:
    group: apps
    cask: [codex]
    aur: [openai-codex-bin]
